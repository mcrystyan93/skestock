<cdk-virtual-scroll-viewport itemSize="73"
                             class="h-full w-full"
                             (scroll)="onScroll($event)">
  <nz-list>
    @if (items().length === 0) {
      <nz-list-empty />
    }

    <nz-list-item *cdkVirtualFor="let item of items(); trackBy: (index, item) => item.id">
      <nz-list-item-meta>
        <nz-list-item-meta-avatar>
          <nz-avatar class="shrink-0"
                     [nzIcon]="!!item.icon?.fileName ? ('icons:' + item.icon!.fileName) : 'icons:box'" />
        </nz-list-item-meta-avatar>

        <nz-list-item-meta-title>
          {{ item.name }}
        </nz-list-item-meta-title>

        <nz-list-item-meta-description>
          <span>
            {{ columns.itemCount.label }}: {{ item.itemCount }}
          </span>
          <nz-divider nzType="vertical" />
          <span>
            <nz-icon nzType="icons:clock" />
            {{ item.lastModifiedDate | date:'short' }}
          </span>
          <nz-divider nzType="vertical" />
          <span>
            <nz-icon nzType="icons:user-pen" />
            {{ item.lastModifiedByName }}
          </span>
        </nz-list-item-meta-description>
      </nz-list-item-meta>

      <ul nz-list-item-actions>
        <nz-list-item-action>
          <button nz-button nzSize="small"
                  nzType="link"
                  type="button"
                  class="px-0!"
                  title="Editeaza"
                  [attr.aria-label]="'Editeaza'"
                  (click)="onEdit.emit(item)">
                  <nz-icon nzType="icons:pencil"></nz-icon>
          </button>
        </nz-list-item-action>
      </ul>
    </nz-list-item>
  </nz-list>
</cdk-virtual-scroll-viewport>
