@let dimensions = tableDimensions();

<nz-table #table
          nzTableLayout="fixed"
          [nzData]="itemsVirtualData()"
          [nzVirtualItemSize]="virtualItemSize()"
          [nzVirtualMinBufferPx]="virtualMinBufferPx()"
          [nzVirtualMaxBufferPx]="virtualMaxBufferPx()"
          [nzVirtualForTrackBy]="(index, item) => item.id ?? item.index"
          [nzFrontPagination]="false"
          [nzShowPagination]="false"
          [nzLoading]="loading()"
          nzSize="small"
          [nzScroll]="{x:dimensions.width, y:dimensions.height}">
  <thead>
  <tr>
    <th [nzWidth]="columnLayout.name.width">
      {{ columns.name.label }}
    </th>
    <th [nzWidth]="columnLayout.itemCount.width"
        class="text-right!">
      {{ columns.itemCount.label }}
    </th>
    <th [nzWidth]="columnLayout.lastModifiedDate.width">
      {{ columns.lastModifiedDate.label }}
    </th>
    <th [nzWidth]="columnLayout.actions.width">
      {{ columns.actions.label }}
    </th>
  </tr>
  </thead>
  <tbody>
  <ng-template nz-virtual-scroll
               let-category>
    <tr (click)="onEdit.emit(category)"
        class="cursor-pointer">
      <td>
        <div class="flex gap-2 items-center">
          <nz-avatar class="shrink-0"
                     [nzIcon]="category.icon?.fileName ? ('icons:'+category.icon.fileName) : 'icons:box'" />
          <span class="min-w-0 flex-1 truncate"
                [attr.title]="category.name">
            {{ category.name }}
          </span>
        </div>
      </td>
      <td class="text-right">
        <nz-tag>
          {{ category.itemCount }}
        </nz-tag>
      </td>
      <td>
        <div>
          {{ category.lastModifiedDate | timeAgo }}
        </div>
        <div nz-typography
             nzType="secondary"
             class="mb-0!">
          {{ category.lastModifiedByName }}
        </div>
      </td>
      <td>
        <button nz-button
                nzType="text">
          <nz-icon nzType="icons:pen-to-square"
                   skeStopClick></nz-icon>
        </button>
        <button nz-button
                nzType="text">
          <nz-icon nzType="icons:trash-can"
                   skeStopClick></nz-icon>
        </button>
      </td>
    </tr>
  </ng-template>
  </tbody>
</nz-table>
