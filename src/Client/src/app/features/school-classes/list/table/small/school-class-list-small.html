<cdk-virtual-scroll-viewport itemSize="73" class="h-full w-full" (scroll)="onScroll($event)">
  <nz-list>
    @if (items().length === 0) {
      <nz-list-empty />
    }

    <nz-list-item *cdkVirtualFor="let schoolClass of items(); trackBy: (index, item) => item.id">
      <nz-list-item-meta>
        <nz-list-item-meta-title>
          <span class="block truncate" [attr.title]="schoolClass.name">
            {{ schoolClass.name }}
          </span>
        </nz-list-item-meta-title>

        <nz-list-item-meta-description>
          <div class="flex min-w-0 items-center">
            <span class="shrink-0">
              {{ schoolClass.startDate | date }} - {{ schoolClass.endDate | date }}
            </span>
            <nz-divider nzType="vertical" />
            <nz-tag [nzColor]="statusColor(schoolClass.status)">
              {{ statusLabel(schoolClass.status) }}
            </nz-tag>
          </div>
        </nz-list-item-meta-description>
      </nz-list-item-meta>

      <ul nz-list-item-actions>
        <nz-list-item-action>
          <button
            type="button"
            nz-button nzSize="small"
            nzType="link"
            title="Vizualizeaza"
            aria-label="Vizualizeaza"
            (click)="onView.emit(schoolClass)"
          >
            <nz-icon nzType="icons:eye" />
            Vizualizeaza
          </button>
        </nz-list-item-action>
        <nz-list-item-action>
          <button
            type="button"
            nz-button nzSize="small"
            nzType="link"
            title="Editeaza"
            aria-label="Editeaza"
            (click)="onEdit.emit(schoolClass)"
          >
            <nz-icon nzType="icons:pencil" />
            Modifica
          </button>
        </nz-list-item-action>
      </ul>
    </nz-list-item>
  </nz-list>
</cdk-virtual-scroll-viewport>
