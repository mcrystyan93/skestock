@if (items().length === 0) {
  @if (loading()) {
    <div class="flex flex-col gap-2 px-4"
         aria-busy="true"
         aria-label="Se încarcă clasele">
      @for (placeholder of skeletonPlaceholders; track placeholder) {
        <nz-card nzSize="small">
          <nz-skeleton [nzActive]="true"
                       [nzTitle]="{ width: '60%' }"
                       [nzParagraph]="{ rows: 1, width: '40%' }" />
        </nz-card>
      }
    </div>
  } @else {
    <nz-empty class="mt-8"
              nzNotFoundContent="Nu există clase" />
  }
} @else {
  <cdk-virtual-scroll-viewport [itemSize]="cardRowHeight"
                               class="min-h-0 w-full grow [&_.cdk-virtual-scroll-content-wrapper]:w-full"
                               (scroll)="onScroll($event)">
    <div *cdkVirtualFor="let schoolClass of items(); trackBy: trackById"
         class="box-border px-4 pb-2"
         [style.height.px]="cardRowHeight">
      <nz-card nzSize="small"
               nzHoverable
               class="relative flex! h-full! cursor-pointer flex-col! [&_.ant-card-body]:flex [&_.ant-card-body]:h-full [&_.ant-card-body]:flex-col">
        <div class="flex min-w-0 items-center justify-between gap-2">
          <button type="button"
                  class="min-w-0 cursor-pointer truncate overflow-hidden! border-0 bg-transparent p-0 text-start text-base! font-semibold [color:inherit] outline-none after:absolute after:inset-0 after:content-[''] focus-visible:after:outline-2 focus-visible:after:-outline-offset-2 focus-visible:after:outline-primary-600"
                  [attr.title]="schoolClass.name"
                  [attr.aria-label]="'Vizualizează clasa ' + schoolClass.name"
                  (click)="onView.emit(schoolClass)">{{ schoolClass.name }}</button>
          <button type="button"
                  nz-button
                  nzType="text"
                  class="relative shrink-0"
                  nz-tooltip
                  nzTooltipTitle="Modifică"
                  [attr.aria-label]="'Modifică clasa ' + schoolClass.name"
                  (click)="onEdit.emit(schoolClass)">
            <nz-icon nzType="icons:pencil" />
          </button>
        </div>
        <div nz-typography
             nzType="secondary"
             class="mb-0! mt-1 truncate">
          <nz-icon nzType="icons:clock" />
          {{ schoolClass.startDate | date }} - {{ schoolClass.endDate | date }}
        </div>
        <div class="grow"></div>
        <div class="flex justify-end">
          <nz-badge [nzStatus]="statusColor(schoolClass.status)"
                    [nzText]="statusLabel(schoolClass.status)" />
        </div>
      </nz-card>
    </div>
  </cdk-virtual-scroll-viewport>

  @if (isLoadingMore()) {
    <div class="flex justify-center py-2">
      <nz-spin nzSimple
               nzSize="small"
               nzTip="Se încarcă..." />
    </div>
  }
}
