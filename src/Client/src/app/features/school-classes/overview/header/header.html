<nz-page-header [nzGhost]="false"
                class="block min-w-0 max-w-full overflow-hidden">
  <nz-page-header-title>
    {{ schoolClass().name }}
  </nz-page-header-title>
  <nz-page-header-subtitle>
    {{ schoolClass().startDate | date }} - {{ schoolClass().endDate | date }}
  </nz-page-header-subtitle>

  <nz-page-header-content class="block w-full min-w-0 max-w-full">
    <div class="w-full min-w-0 max-w-full overflow-x-auto">
      <div class="flex w-max min-w-full flex-nowrap gap-4">
        <nz-statistic class="flex-none"
                      nzTitle="Comenzi receptionate"
                      [nzValue]="summary().noOfGoodsReceipt ?? 0"/>
        <nz-statistic class="flex-none"
                      nzTitle="Totalul comenzilor"
                      [nzValueTemplate]="totalAmountTemplate">
          <ng-template #totalAmountTemplate>
            {{ summary().totalAmount ?? 0 | currency:'RON' }}
          </ng-template>
        </nz-statistic>
        <ske-goods-receipt-cost-statistic class="flex-none"
                                          [receipts]="summary().goodsReceipts ?? []"/>
        <nz-statistic class="flex-none"
                      nzTitle="Nr total de articole"
                      [nzValue]="summary().distinctItemsCount ?? 0"/>
        <nz-statistic class="flex-none"
                      nzTitle="Articole cu stoc redus"
                      [nzValueTemplate]="lowStockItemsCountTemplate">
          <ng-template #lowStockItemsCountTemplate>
            <div nz-typography
                 nzType="warning"
                 class="mb-0">
              {{ summary().lowStockItemsCount ?? 0 }}
            </div>
          </ng-template>
        </nz-statistic>
        <nz-statistic class="flex-none"
                      nzTitle="Comenzi in procesare"
                      [nzValue]="summary().processingImportsCount ?? 0"/>
        <nz-statistic class="flex-none"
                      nzTitle="Comenzi in asteptare"
                      [nzValue]="summary().pendingReviewImportsCount ?? 0"/>
        <nz-statistic class="flex-none"
                      nzTitle="Comenzi esuate"
                      [nzValueTemplate]="failedImportsCountTemplate">
          <ng-template #failedImportsCountTemplate>
            <div nz-typography
                 nzType="danger"
                 class="mb-0">
              {{ summary().failedImportsCount ?? 0 }}
            </div>
          </ng-template>
        </nz-statistic>
      </div>
    </div>
  </nz-page-header-content>

  <nz-page-header-extra>
    <nz-space>
      <button nz-button
              nzSize="small"
              *nzSpaceItem
              nzType="primary"
              type="button"
              (click)="onAddGoodsReceipt.emit()">
        <nz-icon nzType="icons:file-import"></nz-icon>
        Adauga comanda
      </button>

      <button type="button"
              *nzSpaceItem
              nz-button
              nzSize="small"
              nzType="default"
              (click)="onClose.emit()">
        <nz-icon nzType="icons:xmark"></nz-icon>
        Inchide
      </button>
    </nz-space>
  </nz-page-header-extra>

  <nz-page-header-footer class="mt-0!">
    <nz-tabs [(nzSelectedIndex)]="selectedTabIndex">
      <nz-tab nzTitle="Stoc"></nz-tab>
      <nz-tab nzTitle="Comenzi"></nz-tab>
      <nz-tab nzTitle="Comenzi importate"></nz-tab>
    </nz-tabs>
  </nz-page-header-footer>
</nz-page-header>
