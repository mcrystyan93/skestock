<nz-card [nzTitle]="title"
         class="h-full">
  <ng-template #title>
    <h3 class="m-0 whitespace-normal break-words text-lg font-medium">{{ department().name }}</h3>
  </ng-template>
  <p class="whitespace-pre-line break-words">{{ department().responsibilities }}</p>
  <form class="flex flex-col gap-3 sm:flex-row sm:items-end"
        (submit)="$event.preventDefault(); saveResponsiblePerson()">
    <nz-form-item class="mb-0! min-w-0 flex-1 flex-col items-stretch">
      <nz-form-label class="text-left"
                     [nzFor]="'responsible-' + department().id">Responsabil
      </nz-form-label>
      <nz-form-control>
        <input nz-input
               nzSize="large"
               class="min-h-11"
               [id]="'responsible-' + department().id"
               type="text"
               autocomplete="name"
               [formField]="responsiblePersonForm.responsiblePerson"
               (input)="edited.emit()" />
      </nz-form-control>
    </nz-form-item>
    <button nz-button
            nzSize="large"
            type="submit"
            class="min-h-11 shrink-0"
            [nzLoading]="saving()"
            [disabled]="disabled() || responsiblePersonForm().submitting()"
            [attr.aria-label]="'Salvează responsabilul pentru ' + department().name">
      {{ saving() ? 'Se salvează…' : 'Salvează' }}
    </button>
  </form>
</nz-card>
