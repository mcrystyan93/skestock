<div *nzModalTitle>Șabloane mesaje</div>

<nz-spin [nzSpinning]="store.templatesLoading()">
  @if (store.templatesProblemDetail(); as problem) {
    <p class="text-red-600 dark:text-red-400">{{ problem.detail ?? 'Șabloanele nu au putut fi încărcate.' }}</p>
  }
  <nz-tabs [nzSelectedIndex]="activeIndex()"
           (nzSelectedIndexChange)="activeIndex.set($event)">
    @for (template of store.templates(); track template.type) {
      <nz-tab [nzTitle]="titles[template.type]">
        <ske-fruit-dessert-template-pane [template]="template"
                                         [placeholders]="store.placeholders()"
                                         [error]="savedType() === template.type ? store.saveError() : null"
                                         (saved)="save(template.type, $event)" />
      </nz-tab>
    }
  </nz-tabs>
</nz-spin>

<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()">
      Închide
    </button>
    <button nz-button
            *nzSpaceItem
            nzType="primary"
            type="button"
            [nzLoading]="store.saving()"
            [disabled]="store.saving() || (activePane()?.invalid() ?? true)"
            (click)="activePane()?.save()">
      Salvează
    </button>
  </nz-space>
</div>
