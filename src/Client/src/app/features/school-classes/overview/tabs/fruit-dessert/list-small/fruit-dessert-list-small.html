@if (entries().length === 0) {
  @if (loading()) {
    <div class="flex flex-col gap-2 px-4 py-2"
         aria-busy="true"
         aria-label="Se încarcă planificarea">
      @for (placeholder of skeletonPlaceholders; track placeholder) {
        <nz-card nzSize="small">
          <nz-skeleton [nzActive]="true"
                       [nzTitle]="{ width: '60%' }"
                       [nzParagraph]="{ rows: 2, width: '70%' }"/>
        </nz-card>
      }
    </div>
  } @else {
    <nz-empty class="mt-8"
              nzNotFoundContent="Clasa nu are zile în interval"/>
  }
} @else {
  <div class="flex min-h-0 w-full grow flex-col gap-2 overflow-x-hidden overflow-y-auto px-4 pb-2"
       role="list"
       aria-label="Planificare fructe și desert">
    @for (entry of entries(); track entry.id) {
      <ske-fruit-dessert-card role="listitem"
                              [entry]="entry"
                              [readOnly]="readOnly()"
                              [sending]="sending()"
                              [downloading]="downloading()"
                              [fallbackUrl]="fallback()?.entryId === entry.id ? fallback()!.url : null"
                              (congregationChange)="congregationChange.emit({ entryId: entry.id, congregationId: $event })"
                              (emailSentChange)="emailSentChange.emit({ entryId: entry.id, emailSent: $event })"
                              (sendMessage)="sendMessage.emit({ entryId: entry.id, type: $event })"
                              (downloadInformare)="downloadInformare.emit({ entryId: entry.id })"/>
    }
  </div>
}
