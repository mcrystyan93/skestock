<form nz-form
      (ngSubmit)="submit()"
      class="w-full">

  <nz-space nzDirection="vertical"
            class="w-full">
    <!-- email -->
    <nz-form-item *nzSpaceItem>
      <nz-form-control [nzErrorTip]="errorTemplate">
        <nz-input-wrapper>
          <nz-icon nzInputPrefix
                   nzType="icons:user"></nz-icon>
          <input type="text"
                 placeholder="Email"
                 nz-input
                 [formField]="loginForm.email">
        </nz-input-wrapper>
      </nz-form-control>
    </nz-form-item>

    <!-- parola -->
    <nz-form-item *nzSpaceItem>
      <nz-form-control [nzErrorTip]="errorTemplate">
        <nz-input-password [nzVisibilityToggle]="true">
          <nz-icon nzInputPrefix
                   nzType="icons:lock"></nz-icon>
          <input placeholder="Parola"
                 nz-input
                 [formField]="loginForm.password">
        </nz-input-password>
      </nz-form-control>
    </nz-form-item>

    <ske-error-display *nzSpaceItem
                       [problemDetail]="problemDetail()"
                       [validationErrors]="validationErrors()"
                       [type]="'text'" />

    <!-- Submit -->
    <button nz-button
            nzBlock
            nzType="primary"
            type="submit"
            [nzLoading]="loading()"
            *nzSpaceItem>
      Login
    </button>
  </nz-space>
</form>

<ng-template #errorTemplate
             let-control>
  @let formControl = control.control;
  @if (formControl.errors?.required; as requiredError) {
    <nz-icon nzType="icons:circle-info"
             class="mr-1"></nz-icon>
    {{ requiredError.message }}
  }
  @if (formControl.errors?.email; as requiredError) {
    <nz-icon nzType="icons:circle-info"
             class="mr-1"></nz-icon>
    {{ requiredError.message }}
  }
</ng-template>
