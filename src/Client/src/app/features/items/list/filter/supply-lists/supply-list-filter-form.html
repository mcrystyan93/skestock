<form (ngSubmit)="onSubmit()"
      nz-form
      nzNoColon
      nzLayout="horizontal">
  <ng-container *skeLayoutBreakpoint="'lg'; else mobileFilters">
    <nz-row [nzGutter]="[16, 8]"
            class="grow">
      <nz-col nzFlex="auto">
        <nz-form-item class="mb-0!">
          <nz-form-control nzSpan="24">
            <ng-container *ngTemplateOutlet="searchInput" />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col>
        <ng-container *ngTemplateOutlet="activeSegmented" />
      </nz-col>
      <nz-col nzFlex="none">
        <button nz-button
                type="button"
                nzType="default"
                (click)="clear()">
          Resetează
        </button>
      </nz-col>
    </nz-row>
  </ng-container>

  <ng-template #mobileFilters>
    <div class="mb-2 flex items-center gap-2">
      <div class="min-w-0 grow">
        <ng-container *ngTemplateOutlet="searchInput" />
      </div>
      <nz-badge [nzCount]="activeFilterCount()"
                nzSize="small">
        <button nz-button
                type="button"
                nzType="default"
                aria-haspopup="dialog"
                [attr.aria-expanded]="filtersOpen()"
                [attr.aria-label]="filtersButtonLabel()"
                (click)="filtersOpen.set(true)">
          <nz-icon nzType="icons:sliders" />
          Filtre
        </button>
      </nz-badge>
    </div>

    <nz-drawer nzTitle="Filtre"
               nzPlacement="bottom"
               nzHeight="auto"
               [nzVisible]="filtersOpen()"
               [nzFooter]="drawerFooter"
               (nzOnClose)="filtersOpen.set(false)">
      <ng-container *nzDrawerContent>
        <div role="group"
             aria-labelledby="supplyListStatusLabel"
             class="flex flex-col gap-2">
          <span id="supplyListStatusLabel">Status</span>
          <ng-container *ngTemplateOutlet="activeSegmented" />
        </div>
      </ng-container>
    </nz-drawer>

    <ng-template #drawerFooter>
      <div class="flex justify-end gap-2">
        <button nz-button
                type="button"
                nzType="default"
                (click)="clear()">
          Resetează
        </button>
        <button nz-button
                type="button"
                nzType="primary"
                (click)="filtersOpen.set(false)">
          Gata
        </button>
      </div>
    </ng-template>
  </ng-template>

  <ng-template #searchInput>
    <nz-input-wrapper>
      <nz-icon nzInputPrefix
               nzType="icons:magnifying-glass"></nz-icon>
      <input type="text"
             nz-input
             id="supplyListSearchTerm"
             placeholder="Căutați după nume..."
             aria-label="Căutați liste după nume"
             [formField]="filterForm.searchTerm" />
    </nz-input-wrapper>
  </ng-template>

  <ng-template #activeSegmented>
    <nz-segmented [formField]="filterForm.active"
                  [nzBlock]="true"
                  aria-label="Filtrează după status">
      @for (option of activeSegmentOptions; track option.value) {
        <label nz-segmented-item
               [nzValue]="option.value">
          {{ option.label }}
        </label>
      }
    </nz-segmented>
  </ng-template>
</form>
