<form (ngSubmit)="onSubmit()"
      nz-form
      nzNoColon
      nzLayout="horizontal">
  <ng-container *skeLayoutBreakpoint="'lg'; else mobileFilters">
    <nz-row [nzGutter]="[16, 0]"
            class="grow">
      <nz-col nzFlex="auto">
        <nz-form-item>
          <nz-form-control nzSpan="24">
            <ng-container *ngTemplateOutlet="searchInput" />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col nzFlex="250px">
        <nz-form-item>
          <nz-form-control nzSpan="24">
            <ng-container *ngTemplateOutlet="categoryDropdown" />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col nzFlex="none">
        <button nz-button
                type="button"
                nzType="default"
                [nzLoading]="loading()"
                (click)="clear()">
          Reseteaza
        </button>
      </nz-col>
    </nz-row>
  </ng-container>

  <ng-template #mobileFilters>
    <div class="mb-2 flex items-center gap-2">
      <div class="min-w-0 grow">
        <ng-container *ngTemplateOutlet="searchInput" />
      </div>
      <nz-badge [nzCount]="activeFilterCount()"
                nzSize="small">
        <button nz-button
                type="button"
                nzType="default"
                aria-haspopup="dialog"
                [attr.aria-expanded]="filtersOpen()"
                [attr.aria-label]="filtersButtonLabel()"
                (click)="filtersOpen.set(true)">
          <nz-icon nzType="icons:sliders" />
          Filtre
        </button>
      </nz-badge>
    </div>

    <nz-drawer nzTitle="Filtre"
               nzPlacement="bottom"
               nzHeight="auto"
               [nzVisible]="filtersOpen()"
               [nzFooter]="drawerFooter"
               (nzOnClose)="filtersOpen.set(false)">
      <ng-container *nzDrawerContent>
        <div role="group"
             aria-labelledby="itemFilterCategoryLabel"
             class="flex flex-col gap-2">
          <span id="itemFilterCategoryLabel">Categorie</span>
          <ng-container *ngTemplateOutlet="categoryDropdown" />
        </div>
      </ng-container>
    </nz-drawer>

    <ng-template #drawerFooter>
      <div class="flex justify-end gap-2">
        <button nz-button
                type="button"
                nzType="default"
                [nzLoading]="loading()"
                (click)="clear()">
          Resetează
        </button>
        <button nz-button
                type="button"
                nzType="primary"
                (click)="filtersOpen.set(false)">
          Gata
        </button>
      </div>
    </ng-template>
  </ng-template>

  <ng-template #searchInput>
    <nz-input-wrapper>
      <nz-icon nzInputPrefix
               nzType="icons:magnifying-glass"></nz-icon>
      <input type="text"
             nz-input
             id="searchTerm"
             placeholder="Cautați..."
             aria-label="Căutați articole"
             [formField]="itemListFilterForm.searchTerm" />
    </nz-input-wrapper>
  </ng-template>

  <ng-template #categoryDropdown>
    <ske-category-dropdown [formField]="itemListFilterForm.category"
                           [allowClear]="true"
                           [allowCreate]="false"
                           [allowEdit]="false" />
  </ng-template>
</form>
