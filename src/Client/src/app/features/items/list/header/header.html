<nz-page-header nzTitle="Articole">
  <nz-page-header-extra>
    <nz-space>
      <button nz-button
              *nzSpaceItem
              nzType="default"
              type="button"
              (click)="onImport.emit()">
        <nz-icon nzType="icons:upload"></nz-icon>
        Importa
      </button>
      <button nz-button
              *nzSpaceItem
              nzType="primary"
              type="button"
              (click)="onAdd.emit()">
        <nz-icon nzType="icons:plus"></nz-icon>
        Adaugă
      </button>
    </nz-space>
  </nz-page-header-extra>
  <nz-page-header-footer>
    <nz-tabs [(nzSelectedIndex)]="selectedTabIndex">
      <nz-tab nzTitle="Articole"></nz-tab>
      <nz-tab nzTitle="Importuri articole"></nz-tab>
    </nz-tabs>
  </nz-page-header-footer>
</nz-page-header>
