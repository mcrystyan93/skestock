@if (items().length === 0) {
  @if (loading()) {
    <div class="flex flex-col gap-2 px-4"
         aria-busy="true"
         aria-label="Se încarcă articolele">
      @for (placeholder of skeletonPlaceholders; track placeholder) {
        <nz-card nzSize="small">
          <nz-skeleton [nzActive]="true"
                       [nzTitle]="{ width: '60%' }"
                       [nzParagraph]="{ rows: 1, width: '40%' }" />
        </nz-card>
      }
    </div>
  } @else {
    <nz-empty class="mt-8"
              nzNotFoundContent="Nu există articole" />
  }
} @else {
  <cdk-virtual-scroll-viewport [itemSize]="cardRowHeight"
                               class="min-h-0 w-full grow [&_.cdk-virtual-scroll-content-wrapper]:w-full"
                               (scroll)="onScroll($event)">
    <div *cdkVirtualFor="let item of items(); trackBy: trackById"
         class="box-border px-4 pb-2"
         [style.height.px]="cardRowHeight">
      <nz-card nzSize="small"
               nzHoverable
               role="button"
               tabindex="0"
               class="h-full cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
               [attr.aria-label]="'Modifică articolul ' + item.name"
               (click)="onEdit.emit(item)"
               (keydown.enter)="onEdit.emit(item)"
               (keydown.space)="onSpace($event, item)">
        <div class="flex min-w-0 items-center justify-between gap-2">
          <strong nz-typography
                  class="mb-0! min-w-0 truncate"
                  [nzType]="item.isActive ? undefined : 'secondary'"
                  [attr.title]="item.name">{{ item.name }}</strong>
          <nz-tag class="me-0! shrink-0"
                  [nzColor]="item.isActive ? 'success' : 'default'">
            {{ item.isActive ? 'Activ' : 'Inactiv' }}
          </nz-tag>
        </div>
        <div nz-typography
             nzType="secondary"
             class="mb-0! mt-1 truncate"
             [attr.title]="subtitle(item)">{{ subtitle(item) }}</div>
      </nz-card>
    </div>
  </cdk-virtual-scroll-viewport>

  @if (isLoadingMore()) {
    <div class="flex justify-center py-2">
      <nz-spin nzSimple
               nzSize="small"
               nzTip="Se încarcă..." />
    </div>
  }
}
