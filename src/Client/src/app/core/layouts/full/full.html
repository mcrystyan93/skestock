<nz-layout>
  <ske-header></ske-header>
  <nz-layout>
    <nz-sider nzCollapsed>
      <ul nz-menu
          nzMode="inline"
          [nzInlineCollapsed]="true">
        <li nz-menu-item
            nzMatchRouter
            [routerLink]="['/home']">
          <nz-icon nzType="icons:house"
                   class="text-2xl!"></nz-icon>
          <span>Acasa</span>
        </li>
        <li nz-menu-item
            nzMatchRouter
            [routerLink]="['/categories']">
          <nz-icon nzType="icons:list"
                   class="text-2xl!"></nz-icon>
          <span>Categorii</span>
        </li>
        <li nz-menu-item
            nzMatchRouter
            [routerLink]="['/items']">
          <nz-icon nzType="icons:box"
                   class="text-2xl!"></nz-icon>
          <span>Produse</span>
        </li>
        <li nz-menu-item
            nzMatchRouter
            [routerLink]="['/school-classes']">
          <nz-icon nzType="icons:school"
                   class="text-2xl!"></nz-icon>
          <span>Clase</span>
        </li>
        <li nz-menu-item
            nzMatchRouter
            [routerLink]="['/class-analytics']">
          <nz-icon nzType="icons:chart-bar"
                   class="text-2xl!"></nz-icon>
          <span>Analiză clase</span>
        </li>
      </ul>
    </nz-sider>
    <nz-content class="flex!">
      <router-outlet></router-outlet>
    </nz-content>
  </nz-layout>
</nz-layout>
