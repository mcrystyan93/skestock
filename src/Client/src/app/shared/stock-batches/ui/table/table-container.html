<ng-container *skeLayoutBreakpoint="'lg'; else small">
  <ske-stock-batches-table [items]="store.stockBatches()"
                           [filter]="store.filter()"
                           [loading]="store.stockBatchesLoading()"
                           [hasNextPage]="store.hasNextPage()"
                           [isLoadingMore]="store.isLoadingMore()"
                           (onFilterChange)="store.load($event)"
                           (onLoadMore)="store.loadMore()"
                           [reduceWidth]="50" />
</ng-container>

<ng-template #small>
  <ske-stock-batches-list-small [items]="store.stockBatches()"
                                [filter]="store.filter()"
                                [loading]="store.stockBatchesLoading()"
                                [hasNextPage]="store.hasNextPage()"
                                [isLoadingMore]="store.isLoadingMore()"
                                (onLoadMore)="store.loadMore()" />
</ng-template>
