<div *nzModalTitle>
  Adaugă stoc pentru un produs
</div>

<nz-steps nzSize="small" class="mb-4" [nzCurrent]="step() === 'source' ? 0 : 1">
  <nz-step nzTitle="Sursă" />
  <nz-step nzTitle="Detalii" />
</nz-steps>

@if (step() === 'source') {
  <ske-stock-batch-source-step [source]="source()"
                               (sourceChange)="source.set($event)" />
}

<div [hidden]="step() === 'source'" data-testid="details-step">
  <ske-add-stock-batch-form [category]="modalData().category"
                            [location]="modalData().location" />
</div>

<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()"
            [nzLoading]="store.stockBatchLoading()">
      Închide
    </button>

    @if (step() === 'source') {
      <button nz-button
              *nzSpaceItem
              nzType="primary"
              type="button"
              (click)="next()">
        Următorul
      </button>
    } @else {
      <button nz-button
              *nzSpaceItem
              nzType="default"
              type="button"
              (click)="back()">
        Înapoi
      </button>

      <nz-space-compact *nzSpaceItem>
        <button nz-button
                nzType="primary"
                type="button"
                (click)="save()"
                [nzLoading]="store.stockBatchLoading()">
          Salvează și închide
        </button>
        <button nz-button
                nzType="primary"
                type="button"
                nz-dropdown
                [nzDropdownMenu]="menu">
          <nz-icon nzType="icons:chevron-down"></nz-icon>
        </button>

        <nz-dropdown-menu #menu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-item
                (click)="save(false)">
              Salvează
            </li>
          </ul>
        </nz-dropdown-menu>
      </nz-space-compact>
    }
  </nz-space>
</div>
