<div *nzModalTitle></div>

<ske-add-stock-batch-form [category]="modalData().category"/>

<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()"
            [nzLoading]="store.stockBatchLoading()">
      Inchide
    </button>

    <nz-space-compact *nzSpaceItem>
      <button nz-button
              nzType="primary"
              type="button"
              (click)="save()"
              [nzLoading]="store.stockBatchLoading()">
        Salveaza si inchide
      </button>
      <button nz-button
              nzType="primary"
              type="button"
              nz-dropdown
              [nzDropdownMenu]="menu">
        <nz-icon nzType="icons:chevron-down"></nz-icon>
      </button>

      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item
              (click)="save(false)">
            Salveaza
          </li>
        </ul>
      </nz-dropdown-menu>
    </nz-space-compact>
  </nz-space>
</div>
