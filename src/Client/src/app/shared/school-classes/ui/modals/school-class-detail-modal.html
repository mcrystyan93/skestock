<div *nzModalTitle>
  @if (store.schoolClassLoading()) {
    Loading...
  } @else {
    @if (store.schoolClass()?.id) {
      {{ store.schoolClass()?.name ?? 'Modifică clasa' }}
    } @else {
      Creează o nouă clasă
    }
  }
</div>

<ske-school-class-form [loading]="store.schoolClassLoading()"
                        [schoolClass]="store.schoolClass()" />

<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()"
            [nzLoading]="store.schoolClassLoading()">
      Inchide
    </button>

    <nz-space-compact *nzSpaceItem>
      <button nz-button
              nzType="primary"
              type="button"
              (click)="save()"
              [nzLoading]="store.schoolClassLoading()">
        Salveaza si inchide
      </button>
      <button nz-button
              nzType="primary"
              type="button"
              nz-dropdown
              [nzDropdownMenu]="menu">
        <nz-icon nzType="icons:chevron-down"></nz-icon>
      </button>

      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item
              (click)="save(false)">
            Salveaza
          </li>
        </ul>
      </nz-dropdown-menu>
    </nz-space-compact>
  </nz-space>
</div>
