<nz-table nzSize="small"
          nzTableLayout="fixed"
          [nzTemplateMode]="true"
          [nzScroll]="{ x: '720px', y: '450px' }"
          [nzFrontPagination]="false"
          [nzShowPagination]="false">
  <thead>
  <tr>
    <th nzWidth="260px">Nume citit</th>
    <th nzWidth="180px">Potrivire</th>
    <th nzWidth="280px">Categorie</th>
  </tr>
  </thead>
  <tbody>
    @for (line of linesForm.lines; track $index) {
      <tr ske-category-import-review-line-row
          [lineForm]="line">
      </tr>
    }
  </tbody>
</nz-table>
