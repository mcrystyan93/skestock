<div *nzModalTitle>
  <h4 nz-typography>Ajustează stoc</h4>
  <div class="flex flex-row gap-2 items-center">
    <nz-avatar nzIcon="icons:shelves"
               [nzSize]="64"></nz-avatar>

    <div nz-typography
         nzType="secondary"
         class="mb-0!">{{ modalData().item.itemName }}
    </div>

  </div>
</div>

<nz-space nzDirection="vertical"
          class="w-full">
  <nz-card nzSize="small"
           *nzSpaceItem>
    <div class="flex items-center justify-between">
      <h4 nz-typography
          class="mb-0!">Cantitatea curenta</h4>
      <strong nz-typography
              class="mb-0!">
        {{ modalData().item.quantity | number:'1.0-2' }}
      </strong>
    </div>
  </nz-card>

  <ske-stock-adjustment-form *nzSpaceItem
                             [loading]="store.stockAdjustmentLoading()"
                             [item]="modalData().item" />
</nz-space>
<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()"
            [nzLoading]="store.stockAdjustmentLoading()">
      Inchide
    </button>


    <nz-space-compact *nzSpaceItem>
      <button nz-button
              nzType="primary"
              type="button"
              (click)="save()"
              [nzLoading]="store.stockAdjustmentLoading()">
        Salvează si inchide
      </button>
      <button nz-button
              nzType="primary"
              type="button"
              nz-dropdown
              [nzDropdownMenu]="menu">
        <nz-icon nzType="icons:chevron-down"></nz-icon>
      </button>

      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item
              (click)="save(false)">
            Salveaza
          </li>
        </ul>
      </nz-dropdown-menu>
    </nz-space-compact>
  </nz-space>
</div>
