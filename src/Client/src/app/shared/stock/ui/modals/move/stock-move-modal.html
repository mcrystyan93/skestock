<div *nzModalTitle>
  <h4 nz-typography>Mută stoc</h4>
  <div class="flex flex-row gap-2 items-center">
    @if (modalData().item.categoryIcon; as categoryIcon) {
      <span class="text-4xl text-primary-600 dark:text-primary-400">
        <nz-icon [nzType]="'icons:' + categoryIcon.fileName"></nz-icon>
      </span>
    } @else {
      <span class="text-4xl text-primary-600 dark:text-primary-400">
        <nz-icon nzType="icons:shelves"></nz-icon>
      </span>
    }
    <div nz-typography
         nzType="secondary"
         class="mb-0!">
      {{ modalData().item.itemName }}
    </div>
  </div>
</div>

<ske-error-display [problemDetail]="store.stockMoveProblemDetail()"
                 [validationErrors]="store.stockMoveValidationErrors()" />

<nz-space nzDirection="vertical"
          class="w-full">
  <div *nzSpaceItem
       class="flex flex-col items-center gap-3 pb-2">
    <div class="w-full rounded-xl border-2 border-solid border-gray-200 bg-gray-50 px-4 py-3 dark:border-gray-700 dark:bg-gray-800">
      <div class="text-xs uppercase tracking-wide text-gray-500">Din locația</div>
      <div class="mt-0.5 flex items-baseline justify-between gap-3">
        <strong class="min-w-0 wrap-break-word text-lg leading-snug">{{ modalData().item.locationName }}</strong>
        <span class="shrink-0 text-base">
          <strong>{{ modalData().item.quantity | number:'1.0-2' }}</strong>
          <span class="text-gray-500"> {{ modalData().item.unit }} disponibil</span>
        </span>
      </div>
    </div>
    <nz-icon nzType="icons:arrow-down"
             class="text-2xl text-primary-600" />
  </div>

  <ske-stock-move-form *nzSpaceItem
                       [loading]="store.stockMoveLoading()"
                       [item]="modalData().item" />
</nz-space>

<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()"
            [nzLoading]="store.stockMoveLoading()">
      Închide
    </button>
    <button nz-button
            *nzSpaceItem
            nzType="primary"
            type="button"
            (click)="save()"
            [nzLoading]="store.stockMoveLoading()">
      Mută stocul
    </button>
  </nz-space>
</div>
