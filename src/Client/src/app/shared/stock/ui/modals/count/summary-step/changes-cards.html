@for (change of changes(); track change.key) {
  <button type="button"
          class="w-full cursor-pointer rounded-md border border-solid border-gray-300 bg-transparent p-3 text-left dark:border-gray-600"
          (click)="changeSelect.emit(change.key)">
    <span class="block wrap-anywhere font-semibold">{{ change.row.itemName }}</span>
    <span class="block wrap-anywhere text-xs opacity-70">{{ change.row.locationName }}</span>
    <span class="mt-1 flex justify-between gap-2">
      <span>{{ change.row.quantity }} → {{ change.newQuantity }}</span>
      <span class="font-semibold"
            [class.text-green-600]="change.delta > 0"
            [class.text-red-600]="change.delta < 0">
        {{ change.delta > 0 ? '+' : '' }}{{ change.delta }}
      </span>
    </span>
  </button>
}
