<nz-row [nzGutter]="[16, 16]"
        nzAlign="middle">
  <nz-col nzFlex="auto">
    <nz-form-item>
      <nz-form-control nzSpan="24">
        <nz-input-wrapper>
          <nz-icon nzInputPrefix
                   nzType="icons:magnifying-glass"></nz-icon>
          <input type="text"
                 nz-input
                 id="searchTerm"
                 placeholder="Cautați..."
                 [formField]="stockListFilterForm.searchTerm" />
        </nz-input-wrapper>
      </nz-form-control>
    </nz-form-item>
  </nz-col>
  <nz-col>
    <nz-form-item>
      <nz-space-compact class="stock-form-compact">
        <ske-location-dropdown [formField]="stockListFilterForm.location"
                               placeholder="Locatie"
                               class="min-w-48"
                               [allowClear]="true" />
        <ske-category-dropdown [formField]="stockListFilterForm.category"
                               placeholder="Categorie"
                               class="min-w-48"
                               [allowClear]="true"
                               [allowCreate]="false"
                               [allowEdit]="false" />
      </nz-space-compact>
    </nz-form-item>
  </nz-col>
  <nz-col>
    <nz-segmented [formField]="stockListFilterForm.booleanSegmentValue">
      @for (option of booleanSegmentOptions; track option.value) {
        <label nz-segmented-item
               [nzValue]="option.value">
          {{ option.label }}
        </label>
      }
    </nz-segmented>
  </nz-col>
  <nz-col>
    <button nz-button
            type="button"
            nzType="default"
            [nzLoading]="loading()"
            (click)="clear()">
      Reseteaza
    </button>

  </nz-col>
</nz-row>
