<form (ngSubmit)="onSubmit()"
      nz-form
      nzNoColon
      nzLayout="horizontal">
  <nz-row [nzGutter]="[16, 0]"
          class="grow">
    <nz-col nzFlex="auto">
      <nz-form-item>
        <nz-form-control nzSpan="24">
          <nz-input-wrapper>
            <nz-icon nzInputPrefix
                     nzType="icons:magnifying-glass"></nz-icon>
            <input type="text"
                   nz-input
                   id="searchTerm"
                   placeholder="Cautați..."
                   nzVariant="borderless"
                   [formField]="stockListFilterForm.searchTerm" />
          </nz-input-wrapper>
        </nz-form-control>
      </nz-form-item>
    </nz-col>
    <nz-col nzFlex="250px">
      <nz-form-item>
        <nz-form-control nzSpan="24">
          <ske-location-dropdown [formField]="stockListFilterForm.location"
                                 [allowClear]="true" />
        </nz-form-control>
      </nz-form-item>
    </nz-col>
    <nz-col nzFlex="250px">
      <nz-form-item>
        <nz-form-control nzSpan="24">
          <ske-category-dropdown [formField]="stockListFilterForm.category"
                                 [allowClear]="true"
                                 [allowCreate]="false"
                                 [allowEdit]="false" />
        </nz-form-control>
      </nz-form-item>
    </nz-col>
    <nz-col nzFlex="none">
      <nz-space class="ml-3">
        <button type="submit"
                *nzSpaceItem
                nz-button
                nzSize="small"
                nzType="primary"
                [nzLoading]="loading()">
          <nz-icon nzType="icons:magnifying-glass"></nz-icon>
          Cauta
        </button>
        <button *nzSpaceItem
                nz-button
                nzSize="small"
                type="button"
                nzType="default"
                [nzLoading]="loading()"
                (click)="clear()">
          <nz-icon nzType="icons:xmark"></nz-icon>
          Reseteaza
        </button>
      </nz-space>
      <nz-divider nzType="vertical"></nz-divider>
      <button nz-button
              nzSize="small"
              nzType="primary"
              type="button"
              (click)="onAdd.emit()">
        <nz-icon nzType="icons:plus"></nz-icon>
        Adauga produs
      </button>
    </nz-col>
  </nz-row>
  <nz-row [nzGutter]="[16, 0]">
    <nz-col nzFlex="none">
      <nz-form-item class="gap-2 items-center">
        <nz-form-label>Afișează produsele ascunse</nz-form-label>
        <nz-form-control>
          <nz-switch [formField]="stockListFilterForm.includeHidden"/>
        </nz-form-control>
      </nz-form-item>
    </nz-col>
    <nz-col nzFlex="none">
      <nz-form-item class="gap-2 items-center">
        <nz-form-label>Afișează cele cu stoc redus</nz-form-label>
        <nz-form-control>
          <nz-switch [formField]="stockListFilterForm.lowStockOnly" />
        </nz-form-control>
      </nz-form-item>
    </nz-col>
    <nz-col nzFlex="none">
      <nz-form-item class="gap-2 items-center">
        <nz-form-label>Afișează cele expirate</nz-form-label>
        <nz-form-control>
          <nz-switch [formField]="stockListFilterForm.expiredOnly" />
        </nz-form-control>
      </nz-form-item>
    </nz-col>
  </nz-row>
</form>
