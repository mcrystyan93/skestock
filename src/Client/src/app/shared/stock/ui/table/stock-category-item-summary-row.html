@let stockItem = item();

<td nzRight>
  <div class="flex items-center gap-3">
    <ske-item-thumbnail [itemId]="stockItem.itemId"
                        [imageFileId]="stockItem.imageFileId" />
    <div class="flex flex-col">
      <strong>{{ stockItem.itemName }}</strong>
      <div>
        <span nz-typography
              nzType="secondary"
              class="mb-0!">{{ stockItem.sku ?? '-' }}</span>
        <span> - </span>
        <strong nz-typography
                nzType="secondary">
          <nz-icon nzType="icons:clock"></nz-icon>
          {{ stockItem.lastUpdatedAt ? (stockItem.lastUpdatedAt | timeAgo) : '-' }}
        </strong>
      </div>
    </div>
  </div>
</td>
<td class="text-right!">
  <h5 nz-typography
      class="mb-0!">{{ totalQuantity() }} {{ stockItem.unit }}</h5>
  <span nz-typography
        nzType="secondary">total</span>
</td>
<td>
  <span nz-typography
        nzType="secondary">{{ locations().length }} locații</span>
</td>
<td>
  <div class="flex flex-wrap gap-1">
    @if (stockItem.isPerishable) {
      <nz-tag nzColor="orange">Perisabil</nz-tag>
    } @else {
      <nz-tag>Nu</nz-tag>
    }
  </div>
</td>
<td></td>
