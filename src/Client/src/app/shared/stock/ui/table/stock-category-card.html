<ng-template #cardTitle>
  <div class="flex items-center gap-4">
    <nz-icon [nzType]="category().categoryIcon?.fileName
      ? ('icons:' + category().categoryIcon?.fileName)
      : 'icons:box'"
             class="text-3xl text-blue-500!"></nz-icon>
    <div class="flex flex-col">
      <div class="flex flex-wrap items-center gap-2">
        <h3 nz-typography
            class="mb-0!">{{ category().categoryName }}</h3>
        @if (hasExpiredItems()) {
          <nz-tag nzColor="red">Posibil expirat</nz-tag>
        }
      </div>
      <span nz-typography
            nzType="secondary"
            class="mb-0!">{{ items().length }} articol(e) in stoc</span>
    </div>
  </div>
</ng-template>

<ng-template #cardExtra>
  <button nz-button
          nzType="link"
          type="button"
          [attr.aria-label]="'Adauga stoc pentru ' + category().categoryName"
          nz-tooltip
          [nzTooltipTitle]="'Adauga stoc pentru ' + category().categoryName"
          (click)="addStock()">
    <nz-icon nzType="icons:plus"></nz-icon>
    Adauga
  </button>
</ng-template>

<nz-card nzSize="small"
         [nzTitle]="cardTitle"
         [nzExtra]="cardExtra">
  <ske-stock-category-items-table [items]="items()"
                                  [loading]="loading()"
                                  (adjust)="adjust.emit($event)"
                                  (move)="move.emit($event)"
                                  (removeExpired)="removeExpired.emit($event)"
                                  (visibilityChange)="visibilityChange.emit($event)"/>
</nz-card>
