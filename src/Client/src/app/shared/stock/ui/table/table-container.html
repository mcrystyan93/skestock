@if (store.stockItems().length === 0) {
  <div class="w-full flex justify-center items-center h-full">
    <nz-empty></nz-empty>
  </div>
} @else {
  <ske-stock-table [groupItems]="store.groupedStockItems()"
                   [loading]="store.stockItemsLoading()"
                   (onAdjust)="onAdjust($event)"
                   (onMove)="onMove($event)"
                   (onRemoveExpired)="onRemoveExpired($event)"
                   (onVisibilityChange)="onVisibilityChange($event)"
                   (onAdd)="addStock($event)" />
}
