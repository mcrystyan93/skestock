<div *nzModalTitle>
  @if (store.congregationLoading()) {
    Se încarcă...
  } @else {
    @if (store.congregation()?.id) {
      {{ store.congregation()?.name ?? 'Modifică congregația' }}
    } @else {
      Creează o congregație nouă
    }
  }
</div>

<ske-error-display [problemDetail]="store.congregationProblemDetail()"
                 [validationErrors]="store.congregationValidationErrors()"/>

<ske-congregation-form [loading]="store.congregationLoading()"
          [congregation]="store.congregation()"/>

<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()"
            [nzLoading]="store.congregationLoading()">
      Închide
    </button>

    <nz-space-compact *nzSpaceItem>
      <button nz-button
              nzType="primary"
              type="button"
              (click)="save()"
              [nzLoading]="store.congregationLoading()">
        Salvează și închide
      </button>
      <button nz-button
              nzType="primary"
              type="button"
              nz-dropdown
              [nzDropdownMenu]="menu">
        <nz-icon nzType="icons:chevron-down"></nz-icon>
      </button>

      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item
              (click)="save(false)">
            Salvează
          </li>
        </ul>
      </nz-dropdown-menu>
    </nz-space-compact>
  </nz-space>
</div>
