<input
  #picker
  hidden
  type="file"
  accept="image/jpeg,image/png,image/webp,image/gif"
  (change)="replace($event)"
/>

<nz-upload
  nzListType="picture-card"
  nzAccept="image/jpeg,image/png,image/webp,image/gif"
  [nzLimit]="1"
  [nzShowButton]="fileList().length === 0"
  [nzShowUploadList]="{ showPreviewIcon: false }"
  [nzBeforeUpload]="beforeUpload"
  [nzRemove]="remove"
  [nzFileList]="fileList()"
>
  <div>
    <nz-icon nzType="icons:plus" />
    <div class="mt-2">Încarcă</div>
  </div>
</nz-upload>

@if (fileList().length > 0) {
  <button
    nz-button
    type="button"
    nzType="default"
    [disabled]="uploading()"
    (click)="picker.click()"
  >
    Schimbă
  </button>
}
