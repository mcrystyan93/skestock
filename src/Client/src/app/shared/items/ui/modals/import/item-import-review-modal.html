<div *nzModalTitle>Revizuire import articole</div>

@if (store.reviewProblemDetail()) {
  <nz-alert nzType="error" nzShowIcon class="mb-3"
            nzMessage="Nu am putut incarca sau salva importul."
            [nzDescription]="store.reviewProblemDetail()?.detail ?? 'Verificati datele introduse.'" />
}

@if (validationMessage(); as message) {
  <nz-alert nzType="warning" nzShowIcon class="mb-3" [nzMessage]="message" />
}

@if (store.review(); as review) {
  <div class="mb-3 flex gap-2 items-center">
    <span>Stare:</span>
    <nz-tag>{{ review.status }}</nz-tag>
    <span class="text-gray-500">Randuri: {{ lines().length }}</span>
  </div>
}

<nz-divider></nz-divider>
<ske-item-import-review-table [lines]="lines()" (linesChange)="lines.set($event)" />

<div *nzModalFooter>
  <nz-space>
    <button nz-button *nzSpaceItem nzType="default" type="button" (click)="close()">Inchide</button>
    <button nz-button *nzSpaceItem nzType="primary" type="button"
            [nzLoading]="store.reviewConfirmLoading()"
            [disabled]="store.reviewLoading() || !lines().length"
            (click)="save()">Confirma si creeaza articolele</button>
  </nz-space>
</div>
