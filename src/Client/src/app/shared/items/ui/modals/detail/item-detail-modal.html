<div *nzModalTitle>
  @if (store.itemLoading()) {
    Loading...
  } @else {
    @if (store.item()?.id) {
      Editeaza articol
      <div nz-typography
           nzType="secondary"
           class="mb-0!">
        {{ store.item()?.name ?? 'Modifica articolul' }}
        ·
        Cod
        {{ store.item()?.sku ?? '' }}
      </div>
    } @else {
      Creaza un nou articol
    }
  }
</div>
<ske-error-display [problemDetail]="store.itemProblemDetail()"
                   [validationErrors]="store.itemValidationErrors()" />
<ske-item-form [loading]="store.itemLoading()"
               [item]="store.item()" />

<div *nzModalFooter>
  <nz-space>
    <button nz-button
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()"
            [nzLoading]="store.itemLoading()">
      Inchide
    </button>

    <nz-space-compact *nzSpaceItem>
      <button nz-button
              nzType="primary"
              type="button"
              (click)="save()"
              [nzLoading]="store.itemLoading()">
        Salveaza si inchide
      </button>
      <button nz-button
              nzType="primary"
              type="button"
              nz-dropdown
              [nzDropdownMenu]="menu">
        <nz-icon nzType="icons:chevron-down"></nz-icon>
      </button>

      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item
              (click)="save(false)">
            Salveaza
          </li>
        </ul>
      </nz-dropdown-menu>
    </nz-space-compact>
  </nz-space>
</div>
