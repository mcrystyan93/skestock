<nz-table [nzData]="lines()" nzSize="small" [nzScroll]="{ x: '1250px', y: '450px' }"
          [nzFrontPagination]="false" [nzShowPagination]="false">
  <thead>
  <tr>
    <th nzWidth="150px">SKU</th>
    <th nzWidth="220px">Denumire</th>
    <th nzWidth="180px">Categorie</th>
    <th nzWidth="130px">Unitate</th>
    <th nzWidth="260px">Descriere</th>
    <th nzWidth="120px">Perisabil</th>
    <th nzWidth="150px">Potrivire</th>
  </tr>
  </thead>
  <tbody>
    @for (line of lines(); track line.rowId) {
      <tr>
        <td><input nz-input [value]="line.sku ?? ''" (input)="update(line.rowId, 'sku', $any($event.target).value)" /></td>
        <td><input nz-input [value]="line.name" (input)="update(line.rowId, 'name', $any($event.target).value)" /></td>
        <td><input nz-input [value]="line.categoryName" (input)="update(line.rowId, 'categoryName', $any($event.target).value)" /></td>
        <td><input nz-input [value]="line.unit" (input)="update(line.rowId, 'unit', $any($event.target).value)" /></td>
        <td><input nz-input [value]="line.description ?? ''" (input)="update(line.rowId, 'description', $any($event.target).value)" /></td>
        <td><input type="checkbox" [checked]="line.isPerishable"
                   (change)="update(line.rowId, 'isPerishable', $any($event.target).checked)" /></td>
        <td>
          @if (line.itemAlreadyExists) { <nz-tag nzColor="green">Articol existent</nz-tag> }
          @else { <nz-tag nzColor="blue">Nou</nz-tag> }
          @if (line.categoryAlreadyExists) { <nz-tag nzColor="green">Categorie existenta</nz-tag> }
        </td>
      </tr>
    }
  </tbody>
</nz-table>
