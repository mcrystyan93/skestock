@let dimensions = tableDimensions();
<nz-table nzSize="small"
          nzTableLayout="fixed"
          [nzTemplateMode]="true"
          [nzFrontPagination]="false"
          [nzShowPagination]="false"
          [nzScroll]="{x:dimensions.width, y:dimensions.height}">
  <thead>
  <tr>
    <th nzWidth="100px">Cod</th>
    <th>Denumire</th>
    <th nzWidth="200px">Categorie</th>
    <th nzWidth="130px">Unitate</th>
  </tr>
  </thead>
  <tbody>
    @for (line of linesForm.lines; track $index) {
      <tr ske-item-import-review-line-row
          [lineForm]="line">
      </tr>
    }
  </tbody>
</nz-table>
