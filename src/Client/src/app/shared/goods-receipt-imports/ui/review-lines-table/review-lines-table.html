@if (alertMessage(); as message) {
  <nz-alert [nzShowIcon]="true"
            [nzType]="message.type"
            [nzMessage]="message.text"></nz-alert>
}

<nz-table #table
          nzTableLayout="fixed"
          [nzTemplateMode]="true"
          [nzFrontPagination]="false"
          [nzShowPagination]="false"
          [nzLoading]="loading()"
          nzSize="small"
          [nzScroll]="{x: '1300px'}">
  <thead>
  <tr>
    <th nzWidth="320px">Produs</th>
    <th nzWidth="150px">Locatie</th>
    <th nzWidth="150px">Cantitate</th>
    <th nzWidth="170px">Data expirare</th>
    <th nzWidth="130px">Pret unitar</th>
    <th nzWidth="100px">
      Actiuni
    </th>
  </tr>
  </thead>
  <tbody>
    @for (lineField of linesForm.lines; track $index) {
      @let line = lineField().value();
      <tr ske-goods-import-review-line-row
          [lineForm]="lineField"
          [line]="line"
          [groupTotal]="groupTotals().get(line.sourceLineIndex)"
          [canRemove]="canRemoveMap().get(line.sourceLineIndex)"
          (splitLine)="splitLine.emit({rowId:$event.rowId})"
          (removeLine)="removeLine.emit({rowId:$event.rowId})"></tr>

    }
  </tbody>
</nz-table>
