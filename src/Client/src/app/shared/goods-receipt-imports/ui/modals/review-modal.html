<div *nzModalTitle>Revizuire import receptie</div>

<ske-error-display [problemDetail]="store.reviewProblemDetail()"
                 [validationErrors]="store.reviewValidationErrors()" />

<ske-goods-receipt-import-review-info [reviewInfo]="store.review()"
                                      [loading]="store.reviewLoading()" />
<nz-divider></nz-divider>
<ske-goods-receipt-import-review-lines-table [lines]="store.lines()"
                                             [loading]="store.reviewLoading()"
                                             (splitLine)="store.splitLine($event)"
                                             (removeLine)="store.removeLine($event)" />

<div *nzModalFooter>
  <nz-space>
    <button nz-button nzSize="small"
            *nzSpaceItem
            nzType="default"
            type="button"
            (click)="close()">
      Inchide
    </button>
    <button nz-button nzSize="small"
            *nzSpaceItem
            nzType="primary"
            type="button"
            [nzLoading]="store.reviewConfirmLoading()"
            [disabled]="store.reviewLoading() || store.review()?.status !== 'pendingReview'"
            (click)="save()">
      Confirma si creeaza receptia
    </button>
  </nz-space>
</div>
