@let dimensions = tableDimensions();

<nz-table #table
          nzTableLayout="fixed"
          [nzData]="itemsVirtualData()"
          [nzVirtualItemSize]="virtualItemSize()"
          [nzVirtualMinBufferPx]="virtualMinBufferPx()"
          [nzVirtualMaxBufferPx]="virtualMaxBufferPx()"
          [nzVirtualForTrackBy]="(index, item) => item.id ?? item.index"
          [nzFrontPagination]="false"
          [nzShowPagination]="false"
          [nzLoading]="loading()"
          nzSize="small"
          [nzScroll]="{x:dimensions.width, y:dimensions.height}">
  <thead>
  <tr>
    <!--    <th nzWidth="150px">-->
    <!--      {{ columns.className.label }}-->
    <!--    </th>-->
    <th>
      Stare
    </th>
    <th nzWidth="280px">
      Incarcat
    </th>
    <th nzRight
        nzWidth="250px">
      Actiuni
    </th>
  </tr>
  </thead>
  <tbody>
  <ng-template nz-virtual-scroll
               let-goodsReceiptImport>
    <tr (click)="goodsReceiptImport.status === 'pendingReview' ? review.emit(goodsReceiptImport) : null"
        class="cursor-pointer">
      <td>
        <nz-badge [nzStatus]="statusColor(goodsReceiptImport.status)"
                  [nzText]="statusLabel(goodsReceiptImport.status)" />
        <div nz-typography
             nzType="secondary"
             class="mb-0!">{{ goodsReceiptImport.processedAt | timeAgo }}
        </div>
      </td>
      <td>
        <div>{{ goodsReceiptImport.uploadedAt | timeAgo }}</div>
        <div nz-typography
             nzType="secondary"
             class="mb-0!">{{ goodsReceiptImport.uploadedByName || '-' }}
        </div>
      </td>
      <td nzRight>
        @if (goodsReceiptImport.status === 'pendingReview') {
          <button type="button"
                  nz-button
                  nzType="primary"
                  nz-tooltip
                  skeStopClick
                  [nzTooltipTitle]="'Revizuieste importul'"
                  [attr.aria-label]="'Revizuieste importul'"
                  (click)="review.emit(goodsReceiptImport)">
            Revizuieste
          </button>
        }
        <button type="button"
                nz-button
                nzType="text"
                nz-tooltip
                skeStopClick
                [nzTooltipTitle]="'Descarca fisierele'"
                [attr.aria-label]="'Descarca fisierele'"
                (click)="downloadFile.emit(goodsReceiptImport)">
          <nz-icon nzType="icons:download"></nz-icon>
          <!--          Descarca-->
        </button>
      </td>
    </tr>
  </ng-template>
  </tbody>
</nz-table>
