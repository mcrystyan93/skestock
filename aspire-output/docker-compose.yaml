services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    environment:
      ASPIRE_DASHBOARD_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "18080:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  dbserver:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "127.0.0.1:1433:1433"
    expose:
      - "1433"
    volumes:
      - type: "volume"
        target: "/var/opt/mssql"
        source: "skestock-db-data"
        read_only: false
    networks:
      - "aspire"
  skestock-cache:
    image: "docker.io/library/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD --save 60 1"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - type: "volume"
        target: "/data"
        source: "skestock-cache-data"
        read_only: false
    networks:
      - "aspire"
  webapi:
    image: "skestock-webapi:latest"
    build:
      context: ".."
      dockerfile: "src/Web/Dockerfile"
      target: "final"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      OpenApiSettings__ApiKey: "${OPENAPISETTINGSAPIKEY}"
      OpenApiSettings__Model: "${OPENAPISETTINGSMODEL}"
      ConnectionStrings__skestock-cache: "skestock-cache:6379,password=${REDIS_PASSWORD}"
      SKESTOCK_CACHE_HOST: "skestock-cache"
      SKESTOCK_CACHE_PORT: "6379"
      SKESTOCK_CACHE_PASSWORD: "${REDIS_PASSWORD}"
      SKESTOCK_CACHE_URI: "redis://:${REDIS_PASSWORD}@skestock-cache:6379"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__skestockDb: "Server=dbserver,1433;User ID=skestock_app;Password=${SQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True;Initial Catalog=skestockDb"
      DataProtection__KeysDirectory: "/var/lib/skestock/data-protection-keys"
      ConnectionStrings__blobservice: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://storage:10000/devstoreaccount1"
      ConnectionStrings__queues: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://storage:10001/devstoreaccount1"
      Storage__PublicBlobEndpoint: "https://blob.cristian-cloud.com"
      Cors__AllowedOrigins__0: "https://ske.cristian-cloud.com"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webapi"
    ports:
      - "7001:8080"
    expose:
      - "8080"
    volumes:
      - type: "volume"
        target: "/var/lib/skestock/data-protection-keys"
        source: "skestock-data-protection-keys"
    depends_on:
      dbserver:
        condition: "service_started"
      skestock-cache:
        condition: "service_started"
      db-migrate:
        condition: "service_completed_successfully"
      storage:
        condition: "service_started"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "60s"
  worker:
    image: "skestock-worker:latest"
    build:
      context: ".."
      dockerfile: "src/Worker/Dockerfile"
      target: "final"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      OpenApiSettings__ApiKey: "${OPENAPISETTINGSAPIKEY}"
      OpenApiSettings__Model: "${OPENAPISETTINGSMODEL}"
      ConnectionStrings__skestock-cache: "skestock-cache:6379,password=${REDIS_PASSWORD}"
      SKESTOCK_CACHE_HOST: "skestock-cache"
      SKESTOCK_CACHE_PORT: "6379"
      SKESTOCK_CACHE_PASSWORD: "${REDIS_PASSWORD}"
      SKESTOCK_CACHE_URI: "redis://:${REDIS_PASSWORD}@skestock-cache:6379"
      ConnectionStrings__skestockDb: "Server=dbserver,1433;User ID=skestock_app;Password=${SQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True;Initial Catalog=skestockDb"
      ConnectionStrings__blobservice: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://storage:10000/devstoreaccount1"
      ConnectionStrings__queues: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://storage:10001/devstoreaccount1"
      Storage__PublicBlobEndpoint: "https://blob.cristian-cloud.com"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "worker"
    depends_on:
      dbserver:
        condition: "service_started"
      skestock-cache:
        condition: "service_started"
      db-migrate:
        condition: "service_completed_successfully"
      storage:
        condition: "service_started"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-c"
        - "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/skestock-worker.heartbeat) )) -lt 180"
      interval: "60s"
      timeout: "5s"
      retries: 3
      start_period: "120s"
  db-migrate:
    image: "skestock-webapi:latest"
    build:
      context: ".."
      dockerfile: "src/Web/Dockerfile"
      target: "final"
    command:
      - "--migrate"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__skestockDb: "Server=dbserver,1433;User ID=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true;Initial Catalog=skestockDb"
      SKESTOCKDB_HOST: "dbserver"
      SKESTOCKDB_PORT: "1433"
      SKESTOCKDB_USERNAME: "sa"
      SKESTOCKDB_PASSWORD: "${SQL_PASSWORD}"
      SKESTOCKDB_URI: "mssql://sa:${SQL_PASSWORD}@dbserver:1433/skestockDb"
      SKESTOCKDB_JDBCCONNECTIONSTRING: "jdbc:sqlserver://dbserver:1433;databaseName=skestockDb;trustServerCertificate=true"
      SKESTOCKDB_DATABASENAME: "skestockDb"
      DatabaseMigration__AppPassword: "${SQL_APP_PASSWORD}"
      DatabaseMigration__MigratorPassword: "${SQL_MIGRATOR_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "db-migrate"
    expose:
      - "8080"
    depends_on:
      dbserver:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "no"
  storage:
    image: "mcr.microsoft.com/azure-storage/azurite:3.35.0"
    command:
      - "azurite"
      - "--location"
      - "/data"
      - "--blobHost"
      - "0.0.0.0"
      - "--queueHost"
      - "0.0.0.0"
      - "--tableHost"
      - "0.0.0.0"
      - "--skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - type: "volume"
        target: "/data"
        source: "storage-data"
        read_only: false
    networks:
      - "aspire"
  redis-commander:
    image: "docker.io/rediscommander/redis-commander:latest"
    environment:
      REDIS_HOSTS: "local:skestock-cache:6379:0:${REDIS_PASSWORD}"
    ports:
      - "8081:8081"
    depends_on:
      skestock-cache:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  skestock-db-data:
    driver: "local"
  skestock-cache-data:
    driver: "local"
  storage-data:
    driver: "local"
  skestock-data-protection-keys:
    driver: "local"
